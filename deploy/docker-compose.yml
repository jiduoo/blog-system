# ============================================
# 博客系统 Docker Compose 配置
# 使用：docker compose up -d --build
# 构建上下文为项目根目录（..），可访问 Backend/ 与 Frontend/
# ============================================

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: blog_system
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: blog_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    volumes:
      - redis_data:/data
    networks:
      - blog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  # 后端服务（Go + Gin）
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: blog-backend
    environment:
      - GIN_MODE=release
    volumes:
      # 挂载 Docker 专用配置（覆盖镜像内默认配置）
      - ./config.yml:/app/config/config.yml:ro
      - backend_logs:/app/logs
    networks:
      - blog-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/blogs"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s

  # 前端服务（Nginx 托管静态文件 + 反向代理后端 API）
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: blog-frontend
    ports:
      - "80:80"
    networks:
      - blog-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

networks:
  blog-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_logs:
